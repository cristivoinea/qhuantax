[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qhuantax"
version = "0.1.0"
description = "Quantum Hall extensions for Quantax"
requires-python = ">=3.12"
dependencies = [
    "quantax>=0.3.0",
    "jax",
    "equinox",
    "numpy",
    "scipy",
    "sympy",
    "quspin==1.0.0",
    "matplotlib",
    "jaxtyping",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]",
]

[tool.setuptools]
packages = ["qhuantax", "qhuantax.nes", "qhuantax.penalty"]
package-dir = { "qhuantax" = "src" }
